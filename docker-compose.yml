# ==================================
# eLISAschool - Docker Compose Production
# ==================================
# Démarrage: docker compose up -d
# Arrêt: docker compose down
# Logs: docker compose logs -f

services:
  # ==================================
  # Base de données PostgreSQL 16
  # ==================================
  postgres:
    image: postgres:16-alpine
    container_name: elisaschool_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elisaschool}
      POSTGRES_USER: ${DB_USER:-elisaschool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elisaschool_user} -d ${DB_NAME:-elisaschool}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================================
  # Redis (cache et synchronisation)
  # ==================================
  redis:
    image: redis:7-alpine
    container_name: elisaschool_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+--pass $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================
  # Backend API Express (Production)
  # ==================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: production
    container_name: elisaschool_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_PORT: ${APP_PORT:-3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-elisaschool}
      DB_USER: ${DB_USER:-elisaschool_user}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_32chars_xx}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@elisaschool.cm}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - elisaschool_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  elisaschool_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
