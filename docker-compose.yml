# ==================================
# eLISAschool - Docker Compose Development
# ==================================
# Démarrage: docker compose up -d
# Arrêt: docker compose down
# Logs: docker compose logs -f
# Ports: Backend=7000, Frontend=7001, PostgreSQL=7002, Redis=7003

services:
  # ==================================
  # Base de données PostgreSQL 16
  # ==================================
  postgres:
    image: postgres:16-alpine
    container_name: elisaschool_db
    restart: unless-stopped
    command: >
      postgres
      -p 7002
    environment:
      POSTGRES_DB: ${DB_NAME:-elisaschool}
      POSTGRES_USER: ${DB_USER:-elisaschool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
    ports:
      - "${DB_PORT:-7002}:7002"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elisaschool_user} -d ${DB_NAME:-elisaschool} -p 7002"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================================
  # Redis (cache et synchronisation)
  # ==================================
  redis:
    image: redis:7-alpine
    container_name: elisaschool_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --port 7003 --requirepass "$REDIS_PASSWORD"
        else
          redis-server --port 7003
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-elisaschool_password}
    ports:
      - "${REDIS_PORT:-7003}:7003"
    volumes:
      - redis_data:/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7003 --pass $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================
  # pgAdmin 4 (Administration PostgreSQL)
  # ==================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: elisaschool_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@elisaschool.cm}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 7004
    ports:
      - "${PGADMIN_PORT:-7004}:7004"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - elisaschool_network
    depends_on:
      - postgres

  # ==================================
  # Backend API Express (Development)
  # ==================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev
    container_name: elisaschool_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Activer les cron jobs même en développement
      ENABLE_CRON_JOBS: ${ENABLE_CRON_JOBS:-true}
      # APP_PORT interne = 7000 (même port que l'externe)
      # Le port externe 7000 est mappé via 'ports' ci-dessous
      APP_URL: ${APP_URL:-http://localhost:7000}
      DB_HOST: postgres
      DB_PORT: 7002
      DB_NAME: ${DB_NAME:-elisaschool}
      DB_USER: ${DB_USER:-elisaschool_user}
      DB_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
      REDIS_HOST: redis
      REDIS_PORT: 7003
      REDIS_PASSWORD: ${REDIS_PASSWORD:-elisaschool_password}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_256bits}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:7001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:7001}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@elisaschool.cm}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      # Backend accessible depuis l'hôte ET le réseau local (0.0.0.0)
      - "0.0.0.0:${APP_PORT:-7000}:7000"
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/backend/node_modules
      - /app/shared/node_modules
      - /app/node_modules
    networks:
      - elisaschool_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Commande de développement avec nodemon (hot-reload)
    command: >
      sh -c "cd /app/backend && \
      npx nodemon --config nodemon.json"

  # ==================================
  # Frontend React/Vite (Development)
  # ==================================
  # Frontend React (Development)
  # ==================================
  frontend:
    image: node:20-alpine
    container_name: elisaschool_frontend
    restart: unless-stopped
    # NOTE: VITE_API_URL est défini pour bypass le proxy Vite (qui a des problèmes de connexion)
    # Le frontend appelle directement le backend via l'hôte (host.docker.internal ou IP)
    environment:
      VITE_API_URL: http://172.18.0.1:7000
    ports:
      # Frontend accessible depuis l'hôte ET le réseau local (0.0.0.0)
      - "0.0.0.0:${FRONTEND_PORT:-7001}:7001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./shared:/shared
    networks:
      - elisaschool_network
    depends_on:
      - backend
    command: >
      sh -c "
        cd /app &&
        echo '📦 Vérification des dépendances...' &&
        if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.package-lock.json' ] || [ ! -x 'node_modules/.bin/vite' ]; then
          echo '⚙️  Installation des dépendances...' &&
          npm install --frozen-lockfile;
        else
          echo '✅ Dépendances déjà installées';
        fi &&
        echo '🚀 Démarrage Vite avec HMR...' &&
        npm run dev -- --host 0.0.0.0 --port 7001
      "

networks:
  elisaschool_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
