<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#1a3a5c" />
        <meta name="description" content="eLISAschool - Gestion Scolaire Intelligente pour établissements africains" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.svg" />
        <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.svg" />
        <link rel="manifest" href="/manifest.json" />
        <script>
            // Injection dynamique du favicon selon la couleur de l'établissement
            (function() {
                try {
                    // Lire la couleur depuis localStorage (store Zustand theme)
                    const themeState = localStorage.getItem('elisaschool-theme');
                    let couleur = '#1a3a5c'; // fallback par défaut
                    
                    if (themeState) {
                        const parsed = JSON.parse(themeState);
                        if (parsed.state?.couleurDominante) {
                            couleur = parsed.state.couleurDominante;
                        }
                    }
                    
                    // Calculer la couleur de contraste pour le texte
                    function getContrastColor(hex) {
                        const r = parseInt(hex.slice(1, 3), 16);
                        const g = parseInt(hex.slice(3, 5), 16);
                        const b = parseInt(hex.slice(5, 7), 16);
                        const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                        return luminance > 0.5 ? '#000000' : '#ffffff';
                    }
                    
                    const couleurTexte = getContrastColor(couleur);
                    
                    // Créer un SVG data-URL avec la couleur dynamique
                    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
                        <circle cx="32" cy="32" r="30" fill="${couleur}"/>
                        <g fill="${couleurTexte}" opacity="0.95">
                            <path d="M18 20 C18 20, 24 18, 32 20 L32 44 C24 42, 18 44, 18 44 Z"/>
                            <path d="M46 20 C46 20, 40 18, 32 20 L32 44 C40 42, 46 44, 46 44 Z"/>
                        </g>
                        <line x1="32" y1="20" x2="32" y2="44" stroke="${couleur}" stroke-width="1.5" opacity="0.3"/>
                    </svg>`;
                    
                    // Encoder en data-URL
                    const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
                    
                    // Remplacer le lien favicon
                    const link = document.querySelector('link[rel="icon"]:not([sizes])');
                    if (link) {
                        link.href = dataUrl;
                    }
                } catch (e) {
                    // Silencieux en cas d'erreur — fallback sur favicon.svg statique
                    console.debug('[Favicon] Échec injection dynamique, fallback statique', e);
                }
            })();
        </script>
        <script>
            // Préchargement intelligent des images de fond - UNIQUEMENT sur la page de login
            // Ce script vérifie si nous sommes sur la page de login avant de précharger
            (function() {
                const isLoginPage = window.location.pathname === '/login' || window.location.pathname === '/';
                
                if (!isLoginPage) {
                    // Ne pas précharger les images de fond sur les autres pages
                    return;
                }
                
                const bgImages = [
                    '/images/login-background.png',
                    '/images/login-background-2.png',
                    '/images/login-background-3.png',
                    '/images/login-background-4.png',
                    '/images/login-background-5.png',
                ];
                
                // Charger les 5 premières images en priorité
                bgImages.forEach(src => {
                    const link = document.createElement('link');
                    link.rel = 'preload';
                    link.as = 'image';
                    link.href = src;
                    document.head.appendChild(link);
                });
                
                // Charger les autres en arrière-plan après le load
                window.addEventListener('load', () => {
                    const remainingImages = [
                        '/images/login-background-6.png',
                        '/images/login-background-7.png',
                        '/images/login-background-8.png',
                        '/images/login-background-9.png',
                        '/images/login-background-10.png',
                        '/images/login-background-11.png',
                        '/images/login-background-12.png',
                        '/images/login-background-13.png',
                        '/images/login-background-14.png',
                        '/images/login-background-15.png',
                        '/images/login-background-16.png',
                        '/images/login-background-17.png',
                        '/images/login-background-18.png',
                        '/images/login-background-19.png',
                        '/images/login-background-20.png',
                    ];
                    remainingImages.forEach(src => {
                        const img = new Image();
                        img.src = src;
                    });
                });
            })();
        </script>
        <title>eLISAschool - Gestion Scolaire</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
