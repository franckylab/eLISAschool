# ==================================
# eLISAschool - Docker Compose
# ==================================
# Commandes: docker compose up -d | docker compose down
# Architecture: nginx (port 7001) → backend (7000) / frontend (7001)
# Les ports backend/frontend sont internes — seul nginx est exposé.

services:
  # ==================================
  # Nginx — Reverse Proxy (point d'entrée unique)
  # ==================================
  # Injecte X-Forwarded-For / X-Real-IP pour l'audit IP client.
  # Proxy WebSocket HMR Vite pour le hot-reload.
  nginx:
    image: nginx:alpine
    container_name: elisaschool_nginx
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-7001}:7001"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - elisaschool_network

  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: elisaschool_db
    restart: unless-stopped
    command: postgres -p 7002
    environment:
      POSTGRES_DB: ${DB_NAME:-elisaschool}
      POSTGRES_USER: ${DB_USER:-elisaschool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
    ports:
      - "127.0.0.1:${DB_PORT:-7002}:7002"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elisaschool_user} -d ${DB_NAME:-elisaschool} -p 7002"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour files d'attente et synchronisation
  redis:
    image: redis:7-alpine
    container_name: elisaschool_redis
    restart: unless-stopped
    command: >
      redis-server
      --port 7003
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-elisaschool_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-7003}:7003"
    volumes:
      - redis_data:/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "-a", "${REDIS_PASSWORD:-elisaschool_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer — Connection Pooling PostgreSQL
  # Phase H.3 — Refonte SaaS v3
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: elisaschool_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${DB_USER:-elisaschool_user}:${DB_PASSWORD:-elisaschool_password}@postgres:7002/${DB_NAME:-elisaschool}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "127.0.0.1:6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    networks:
      - elisaschool_network
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API Express
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.dev
    container_name: elisaschool_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 7002
      DB_NAME: ${DB_NAME:-elisaschool}
      DB_USER: ${DB_USER:-elisaschool_user}
      DB_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
      REDIS_HOST: redis
      REDIS_PORT: 7003
      REDIS_PASSWORD: ${REDIS_PASSWORD:-elisaschool_password}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:7001}
      
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@elisaschool.cm}
      
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      
      # Push (Firebase FCM)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVER_KEY: ${FIREBASE_SERVER_KEY:-}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
    ports:
      - "${BACKEND_PORT:-7000}:7000"
    volumes:
      - ../backend:/app/backend
      - ../shared:/app/shared
      - ../public:/app/public
      - /app/backend/node_modules
      - /app/shared/node_modules
      - /app/node_modules
    networks:
      - elisaschool_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Commande de développement avec nodemon (hot-reload)
    command: >
      sh -c "cd /app/backend && \
      npx nodemon --config nodemon.json"

  # Frontend React/Vite
  frontend:
    image: node:20-alpine
    container_name: elisaschool_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: ""
      WATCHPACK_POLLING: "true"
    expose:
      - "7001"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - ../shared:/shared
    networks:
      - elisaschool_network
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host"

  # pgAdmin - Interface web de gestion PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: elisaschool_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@elisaschool.cm}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 7004
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-7004}:7004"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    networks:
      - elisaschool_network
    depends_on:
      - postgres

networks:
  elisaschool_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
