# ==================================
# eLISAschool - Docker Compose
# ==================================
# Commandes: docker compose up -d | docker compose down

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: elisaschool_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-elisaschool}
      POSTGRES_USER: ${DB_USER:-elisaschool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
    ports:
      - "${DB_PORT:-7002}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elisaschool_user} -d ${DB_NAME:-elisaschool}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour files d'attente et synchronisation
  redis:
    image: redis:7-alpine
    container_name: elisaschool_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-elisaschool_password}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-7003}:6379"
    volumes:
      - redis_data:/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-elisaschool_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Express
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: elisaschool_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-elisaschool}
      DB_USER: ${DB_USER:-elisaschool_user}
      DB_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_32chars}
      
      # Email (SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@elisaschool.cm}
      
      # SMS (Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      
      # Push (Firebase FCM)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVER_KEY: ${FIREBASE_SERVER_KEY:-}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
    ports:
      - "${APP_PORT:-7000}:3000"
    volumes:
      - ../backend:/app
      - /app/node_modules
      - ../shared:/shared
    networks:
      - elisaschool_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # Frontend React/Vite
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: elisaschool_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-7000}/api
    ports:
      - "${FRONTEND_PORT:-7001}:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - ../shared:/shared
    networks:
      - elisaschool_network
    depends_on:
      - backend
    command: npm run dev -- --host

  # pgAdmin - Interface web de gestion PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: elisaschool_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@elisaschool.cm}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-7004}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json
    networks:
      - elisaschool_network
    depends_on:
      - postgres

networks:
  elisaschool_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
