# ==================================
# eLISAschool - Docker Compose Local Développement
# ==================================
# Version: 1.1.0
# Auteur: franck arlos chendjou
#
# Usage: ./deploy.sh local-dev up
# Hot-reload activé, logs debug, IP auto-détectée
# Architecture: nginx (port 80) → backend (7000) / frontend (7001)
# Ports exposés: nginx=80, PostgreSQL=7002, Redis=7003, pgAdmin=7004
# Les ports backend (7000) et frontend (7001) sont internes au réseau Docker.

services:
  # ==================================
  # Nginx — Reverse Proxy (point d'entrée unique)
  # ==================================
  # Proxy les requêtes vers le backend et le frontend.
  # Injecte X-Forwarded-For / X-Real-IP pour l'audit IP client.
  # Proxy le WebSocket HMR de Vite pour le hot-reload.
  # Écoute sur le port 7001 (même URL d'accès pour l'utilisateur).
  nginx:
    image: nginx:alpine
    container_name: elisaschool_nginx
    restart: unless-stopped
    ports:
      - "7001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - elisaschool_network

  # ==================================
  # Base de données PostgreSQL 16
  # ==================================
  postgres:
    image: postgres:16-alpine
    container_name: elisaschool_db
    restart: unless-stopped
    command: postgres -p 7002
    environment:
      POSTGRES_DB: ${DB_NAME:-elisaschool}
      POSTGRES_USER: ${DB_USER:-elisaschool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
    ports:
      - "127.0.0.1:${DB_PORT:-7002}:7002"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elisaschool_user} -d ${DB_NAME:-elisaschool} -p 7002"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================================
  # Redis (cache et synchronisation)
  # ==================================
  redis:
    image: redis:7-alpine
    container_name: elisaschool_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --port 7003 --requirepass "$REDIS_PASSWORD"
        else
          redis-server --port 7003
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-7003}:7003"
    volumes:
      - redis_data:/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7003 ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================
  # pgAdmin 4 (Administration PostgreSQL)
  # ==================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: elisaschool_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@elisaschool.cm}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 7004
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-7004}:7004"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - elisaschool_network
    depends_on:
      - postgres

  # ==================================
  # Backend API Express (Development)
  # ==================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.dev
    container_name: elisaschool_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ENABLE_CRON_JOBS: ${ENABLE_CRON_JOBS:-true}
      HOST_IP: ${HOST_IP:-localhost}
      APP_URL: http://${HOST_IP:-localhost}:7000
      DB_HOST: postgres
      DB_PORT: 7002
      DB_NAME: ${DB_NAME:-elisaschool}
      DB_USER: ${DB_USER:-elisaschool_user}
      DB_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
      REDIS_HOST: redis
      REDIS_PORT: 7003
      REDIS_PASSWORD: ${REDIS_PASSWORD:-elisaschool_password}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_256bits}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      FRONTEND_URL: http://${HOST_IP:-localhost}:7001
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:7001,http://${HOST_IP:-localhost}:7001
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@elisaschool.cm}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVER_KEY: ${FIREBASE_SERVER_KEY:-}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "${BACKEND_PORT:-7000}:7000"
    volumes:
      - ../backend:/app/backend
      - ../shared:/app/shared
      - /app/backend/node_modules
      - /app/shared/node_modules
      - /app/node_modules
    networks:
      - elisaschool_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '🚀 Démarrage backend eLISAschool...' &&
        cd /app/backend &&
        if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.package-lock.json' ]; then
          echo '📦 Installation dépendances...' && npm install;
        fi &&
        echo '✅ Backend prêt - Lancement avec nodemon (hot-reload)...' &&
        exec npx nodemon --config nodemon.json
      "

  # ==================================
  # Frontend React/Vite (Development)
  # ==================================
  frontend:
    image: node:20-alpine
    container_name: elisaschool_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      HOST_IP: ${HOST_IP:-localhost}
    expose:
      - "7001"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - ../shared:/shared
    networks:
      - elisaschool_network
    depends_on:
      - backend
    command: >
      sh -c "
        cd /app &&
        if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.package-lock.json' ] || [ ! -x 'node_modules/.bin/vite' ]; then
          echo '📦 Installation dépendances...' && npm install --frozen-lockfile;
        fi &&
        echo '🌐 Génération .env.local (API via nginx)...' &&
        printf 'VITE_API_URL=\n' > .env.local &&
        echo '✅ VITE_API_URL= (vide — requêtes relatives via nginx)' &&
        echo '🗑️  Nettoyage cache Vite...' &&
        rm -rf node_modules/.vite &&
        echo '🚀 Démarrage Vite HMR...' &&
        npm run dev -- --host 0.0.0.0 --port 7001
      "

networks:
  elisaschool_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
