# ==================================
# eLISAschool - Configuration Nginx Universelle
# ==================================
# Version: 1.0.0
# Auteur: franck arlos chendjou
#
# Ce fichier fonctionne pour TOUS les modes :
# - local-dev, local-prod, cloud-dev, cloud-prod
#
# Le comportement s'adapte automatiquement selon :
# - L'environnement (dev/prod) via variables d'environnement
# - La présence de certificats SSL (auto-détection)
# ==================================

# Upstreams (noms de services Docker)
upstream backend_api {
    server backend:7000;
}

upstream frontend_app {
    server frontend:7001;
}

# ==================================
# HTTP Server (redirect or serve)
# ==================================
server {
    listen 80;
    server_name _;

    # Compression Gzip (tous modes)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;

    # ==================================
    # Let's Encrypt ACME Challenge
    # ==================================
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # ==================================
    # API Backend
    # ==================================
    location /api {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 75s;
    }

    # ==================================
    # Fond principal (SVG statique servi par le backend)
    # ^~ pour primer sur les locations regex d'assets statiques
    # ==================================
    location ^~ /fonds-principal {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================
    # WebSocket (temps réel)
    # ==================================
    location /ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================
    # Monitoring Endpoints
    # ==================================
    location /api/monitoring {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================
    # Vite HMR WebSocket (Hot Module Replacement)
    # ==================================
    # Chemin personnalisé pour le WebSocket HMR de Vite en développement.
    # Permet le hot-reload quand le frontend est derrière nginx.
    location /__vite_hmr {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================
    # Frontend (SPA React)
    # ==================================
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SPA fallback - toutes les routes vers index.html
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # ==================================
    # Cache Statique (1 an)
    # ==================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==================================
    # Sécurité (tous modes)
    # ==================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================================
    # Logs
    # ==================================
    access_log /var/log/nginx/elisaschool-access.log;
    error_log /var/log/nginx/elisaschool-error.log warn;
}

