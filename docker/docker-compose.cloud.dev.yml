# ==================================
# eLISAschool - Docker Compose Cloud Développement
# ==================================
# Version: 1.0.0
# Auteur: franck arlos chendjou
#
# Usage: ./deploy.sh cloud-dev up
# Développement avec domaine, sans SSL
# Ports: Backend=7000, Frontend=7001, PostgreSQL=7002, Redis=7003

services:
  # ==================================
  # Base de données PostgreSQL 16
  # ==================================
  postgres:
    image: postgres:16-alpine
    container_name: elisaschool_db
    restart: unless-stopped
    command: postgres -p 7002
    environment:
      POSTGRES_DB: ${DB_NAME:-elisaschool}
      POSTGRES_USER: ${DB_USER:-elisaschool_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
    ports:
      - "127.0.0.1:${DB_PORT:-7002}:7002"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elisaschool_user} -d ${DB_NAME:-elisaschool} -p 7002"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================================
  # Redis (cache et synchronisation)
  # ==================================
  redis:
    image: redis:7-alpine
    container_name: elisaschool_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-server --port 7003 --requirepass "$REDIS_PASSWORD"
        else
          redis-server --port 7003
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-7003}:7003"
    volumes:
      - redis_data:/data
    networks:
      - elisaschool_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7003 ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================================
  # Backend API Express (Development)
  # ==================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.dev
    container_name: elisaschool_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      ENABLE_CRON_JOBS: ${ENABLE_CRON_JOBS:-true}
      APP_URL: http://${DOMAIN_NAME:-localhost}
      DB_HOST: postgres
      DB_PORT: 7002
      DB_NAME: ${DB_NAME:-elisaschool}
      DB_USER: ${DB_USER:-elisaschool_user}
      DB_PASSWORD: ${DB_PASSWORD:-elisaschool_password}
      REDIS_HOST: redis
      REDIS_PORT: 7003
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: http://${DOMAIN_NAME:-localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@elisaschool.cm}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVER_KEY: ${FIREBASE_SERVER_KEY:-}
      FIREBASE_VAPID_KEY: ${FIREBASE_VAPID_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    expose:
      - "7000"
    networks:
      - elisaschool_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo '🚀 Démarrage backend eLISAschool...' &&
        cd /app/backend &&
        if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.package-lock.json' ]; then
          echo '📦 Installation dépendances...' && npm install;
        fi &&
        echo '🔄 Migrations...' &&
        npx typeorm migration:run -d dist/database/data-source.js || echo '⚠️  Aucune migration' &&
        echo '🌱 Seeds...' &&
        npx ts-node -r tsconfig-paths/register src/database/seeds/run-seeds.ts || echo '⚠️  Seeds OK' &&
        echo '✅ Backend prêt' &&
        npx nodemon --config nodemon.json
      "

  # ==================================
  # Frontend React/Vite (Development)
  # ==================================
  frontend:
    image: node:20-alpine
    container_name: elisaschool_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
    expose:
      - "7001"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - ../shared:/shared
    networks:
      - elisaschool_network
    depends_on:
      - backend
    command: >
      sh -c "
        cd /app &&
        if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.package-lock.json' ] || [ ! -x 'node_modules/.bin/vite' ]; then
          echo '📦 Installation dépendances...' && npm install --frozen-lockfile;
        fi &&
        echo '🌐 Génération .env.local...' &&
        printf 'VITE_API_URL=\n' > .env.local &&
        echo '✅ VITE_API_URL= (requetes relatives via nginx)' &&
        echo '🗑️  Nettoyage cache Vite...' &&
        rm -rf node_modules/.vite &&
        echo '🚀 Démarrage Vite HMR...' &&
        npm run dev -- --host 0.0.0.0 --port 7001
      "

  # ==================================
  # Nginx Reverse Proxy (config universelle)
  # ==================================
  nginx:
    image: nginx:alpine
    container_name: elisaschool_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - elisaschool_network
    depends_on:
      - backend
      - frontend

networks:
  elisaschool_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
