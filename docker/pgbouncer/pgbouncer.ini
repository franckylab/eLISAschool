[databases]
elisaschool = host=postgres port=7002 dbname=elisaschool

[pgbouncer]
; ==================================
; eLISAschool - PgBouncer Configuration
; ==================================
; Connection pooling pour production
; Réduit la charge sur PostgreSQL en réutilisant les connexions
; Phase H.3 — Refonte SaaS v3

listen_addr = 0.0.0.0
listen_port = 6432

; Authentification
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Mode transaction — chaque transaction utilise une connexion différente
; Optimal pour les applications web (nombreuses connexions courtes)
pool_mode = transaction

; Limites de connexions
default_pool_size = 20
max_client_conn = 200
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Timeouts
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 0
query_timeout = 30
query_wait_timeout = 10

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Performance
server_round_robin = 1
ignore_startup_parameters = extra_float_digits

; Admin
admin_users = elisaschool_user
